name: CI - Analisis Estatico Java
 
on:
  push:
    branches: [ "master" ] # Asegurando que la rama sea 'master' como en el historial
  pull_request:
    branches: [ "master" ]
 
jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 # No cambiar esta línea, solo se usa para forzar el commit
 
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
 
      - name: Compilar y ejecutar análisis estático
        # Se asume que este es el working-directory correcto:
        working-directory: ./demo
        run: mvn -B clean verify
